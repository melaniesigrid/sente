name: Deploy server
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "src/engine/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

concurrency:
  group: server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run server
      # Deploying needs a CLOUDFLARE_API_TOKEN repository secret (template "Edit
      # Cloudflare Workers"). Without it the tests above still run and the job stays
      # green; deploy by hand with `npm run deploy:server` until the secret exists.
      - id: gate
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then echo "ok=true" >> "$GITHUB_OUTPUT";
          else echo "ok=false" >> "$GITHUB_OUTPUT"; echo "::notice::No CLOUDFLARE_API_TOKEN secret; skipping the deploy."; fi
      - if: steps.gate.outputs.ok == 'true'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - if: steps.gate.outputs.ok == 'true'
        run: node tools/server/smoke.mjs https://sente-server.melaniesigrid.workers.dev

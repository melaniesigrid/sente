name: Deploy server
on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "src/engine/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

concurrency:
  group: server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Needs a CLOUDFLARE_API_TOKEN repository secret (template "Edit Cloudflare Workers").
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run server
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - run: node tools/server/smoke.mjs https://sente-server.melaniesigrid.workers.dev

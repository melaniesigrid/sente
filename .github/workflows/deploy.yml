name: Deploy
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and a queued one waits its turn rather than killing the
# run that is already publishing. A dispatch and a push to main landed in this
# group together once and cancelled each other, which deployed nothing at all.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      # talk.wasm is built from talk/ during prebuild and is not committed, so a
      # deploy without Go would publish an app whose voice never loads.
      - uses: actions/setup-go@v5
        with:
          go-version-file: talk/go.mod
      - run: npm ci
      - run: npm run build
        env:
          # The site is served from the root of joseki.online, so the base is
          # "/" and BASE_PATH goes unset. It only mattered while the app lived
          # under /<repo>/ on github.io, and vite.config.js still honours it.
          # The game server; set to "" to build without online play.
          VITE_SENTE_SERVER: https://api.joseki.online
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
